[project]
name = "book_chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "openai (>=2.5.0,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "langchain (>=1.0.2,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "xmltodict (>=1.0.2,<2.0.0)",
    "langchain-openai (>=1.0.1,<2.0.0)",
    "langgraph (>=1.0.5,<2.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "langgraph-sdk (>=0.4.4,<0.5.0)",
    "langgraph-cli[inmem] (>=0.4.31,<0.5.0)",
    "streamlit (>=1.56.0,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "langgraph-checkpoint-postgres (>=3.0.5,<4.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
]

[tool.poetry]
packages = [{ include = "book_chatbot", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
